<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/web/shared/styles/theme.css" />
    <link rel="stylesheet" href="/web/shared/styles/components.css" />
    <link rel="stylesheet" href="/web/home/home.css" />
    <title>头模系统</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        --ink: #151922;
        --muted: #697386;
        --line: #dfe5eb;
        --panel: rgba(255, 255, 255, 0.88);
        --accent: #0d766f;
        --accent-strong: #085f59;
        --warm: #d96e38;
        --shadow: 0 24px 70px rgba(17, 31, 44, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          linear-gradient(120deg, rgba(13, 118, 111, 0.1), transparent 34%),
          linear-gradient(300deg, rgba(217, 110, 56, 0.11), transparent 42%),
          #eef3f4;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px;
      }

      .home {
        width: min(1080px, 100%);
      }

      .intro {
        margin-bottom: 24px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 760;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(34px, 6vw, 68px);
        line-height: 1;
        letter-spacing: 0;
      }

      .intro p {
        max-width: 680px;
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.7;
      }

      .module-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .module-card {
        display: grid;
        min-height: 260px;
        padding: 28px;
        color: inherit;
        text-decoration: none;
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.88);
        border-radius: 8px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease;
      }

      .module-card:hover {
        transform: translateY(-3px);
        border-color: rgba(13, 118, 111, 0.38);
        box-shadow: 0 28px 80px rgba(17, 31, 44, 0.18);
      }

      .module-kicker {
        color: var(--warm);
        font-size: 13px;
        font-weight: 780;
      }

      .module-card h2 {
        margin: 18px 0 12px;
        font-size: clamp(26px, 4vw, 42px);
        letter-spacing: 0;
      }

      .module-card p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.65;
      }

      .module-action {
        align-self: end;
        display: inline-flex;
        width: fit-content;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        margin-top: 28px;
        padding: 0 18px;
        color: white;
        background: var(--accent);
        border-radius: 8px;
        font-size: 15px;
        font-weight: 760;
      }

      .module-card:nth-child(2) .module-action {
        background: var(--ink);
      }

      @media (max-width: 760px) {
        main {
          padding: 18px;
        }

        .module-grid {
          grid-template-columns: 1fr;
        }

        .module-card {
          min-height: 220px;
          padding: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="home" aria-label="头模系统功能入口">
        <div class="intro">
          <p class="eyebrow">Human Head Model System</p>
          <h1>头模测量与头模生成</h1>
          <p>选择一个功能模块开始工作。测量模块用于加载 OBJ 头模、打点和导出尺寸；生成模块用于输入参数并生成头部 OBJ。</p>
        </div>

        <div class="module-grid">
          <a class="module-card" href="/measure">
            <span class="module-kicker">Measurement</span>
            <h2>头模测量</h2>
            <p>进入原有测量界面，保留模型加载、上传、批量测量、手动打点、自动检测和 Excel 导出。</p>
            <span class="module-action">进入头模测量</span>
          </a>

          <a class="module-card" href="/generate">
            <span class="module-kicker">Generation</span>
            <h2>头模生成</h2>
            <p>进入参数化生成界面，通过头围、头长、头宽、五官和耳部参数生成可下载的 OBJ 头模。</p>
            <span class="module-action">进入头模生成</span>
          </a>
        </div>
      </section>
    </main>
    <script src="/web/home/home.js"></script>
  </body>
</html>
